version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
    # The release tracker (track-release-pr.yaml) owns baseline pins; ignoring them here
    # avoids duplicate baseline PRs while third-party actions keep their Dependabot PRs.
    ignore:
      - dependency-name: "seanthimons/baseline*"
