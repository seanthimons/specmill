name: Release

on:
  # Every merge to main cuts a patch release. CI-only changes don't ship in
  # the package, and release commits carry [skip ci], so neither re-triggers.
  push:
    branches: [main]
    paths-ignore: ['.github/**']
  workflow_dispatch:
    inputs:
      version-type:
        description: Version component to bump
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Build and check only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@c99a0a60eed152a08d1e34841d45573fef812af2 # v1.2.0
    with:
      # Push events have no inputs: release a patch for real.
      version-type: ${{ inputs.version-type || 'patch' }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      notes-mode: autonewsmd
      news-postprocess-script: dev/build_news.R
    secrets:
      # Fine-grained PAT with Contents read/write on specmill, from an account
      # allowed to push to main. Add before using this workflow.
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
