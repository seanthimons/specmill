name: Release

on:
  # Every merge to main cuts a patch release. CI-only changes don't ship in
  # the package, and release commits carry [skip ci], so neither re-triggers.
  push:
    branches: [main]
    paths-ignore: ['.github/**']
  workflow_dispatch:
    inputs:
      version-type:
        description: Version component to bump
        type: choice
        options: [patch, minor, major, dev]
        default: patch
      dry-run:
        description: Build and check only; do not publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write
    uses: seanthimons/baseline/.github/workflows/release-r-package.yaml@e53831a23ef8f543c3fee58edd390089b0f13a27 # v1.4.0
    with:
      # Push events have no inputs: release a patch for real.
      version-type: ${{ inputs.version-type || 'patch' }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
      notes-mode: autonewsmd
      # Runs before NEWS generation: restores the old version tags in the runner.
      pre-release-check-script: dev/release_tags.R
      news-postprocess-script: dev/build_news.R
    secrets:
      # Fine-grained PAT with Contents read/write on specmill, from an account
      # allowed to push to main. Add before using this workflow.
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

  documentation:
    name: Queue published package documentation
    needs: release
    if: ${{ github.event_name == 'push' || !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # GITHUB_TOKEN publication does not trigger release-event workflows.
      # workflow_dispatch is an explicit exception to that recursion guard.
      - name: Build site from the published release tag
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          gh workflow run pkgdown.yaml --ref "$tag"
