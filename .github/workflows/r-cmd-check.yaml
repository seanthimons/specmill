name: R-CMD-check

on:
  # Run platform checks on demand; automatic releases retain their own check.
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # v1.4.1 leaves TESTTHAT_PARALLEL unset outside Windows.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@6390d0d0d52ab8eba81d81ce75215c6dd2ab377d # v2.3.0
    with:
      matrix: '[{"os":"ubuntu-latest","r":"release"},{"os":"windows-latest","r":"release"}]'
      setup-air: true
