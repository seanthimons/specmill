name: R-CMD-check

on:
  # Run platform checks on demand; automatic releases retain their own check.
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # v1.4.1 leaves TESTTHAT_PARALLEL unset outside Windows.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@ad7b0409c5ae8d28f293826fef0819bd74c7b9e0 # v2.2.0
    with:
      matrix: '[{"os":"ubuntu-latest","r":"release"},{"os":"windows-latest","r":"release"}]'
      setup-air: true
