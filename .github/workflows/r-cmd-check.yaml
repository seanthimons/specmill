name: R-CMD-check

on:
  # Run platform checks on demand; automatic releases retain their own check.
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # v1.4.1 leaves TESTTHAT_PARALLEL unset outside Windows.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@067b932909c9ca4cdce189717c99a62a812d3db9 # v2.2.1
    with:
      matrix: '[{"os":"ubuntu-latest","r":"release"},{"os":"windows-latest","r":"release"}]'
      setup-air: true
