name: R-CMD-check

on:
  # Run platform checks on demand; automatic releases retain their own check.
  workflow_dispatch:

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r-cmd-check:
    name: R CMD check
    # v1.4.1 leaves TESTTHAT_PARALLEL unset outside Windows.
    uses: seanthimons/baseline/.github/workflows/r-cmd-check.yaml@248ad7ec1315ff863abc1d44bf5fe1554fb64f72 # v1.4.1
    with:
      matrix: '[{"os":"ubuntu-latest","r":"release"},{"os":"windows-latest","r":"release"}]'
      setup-air: true
