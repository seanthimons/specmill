# Build and deploy after package publication or on manual dispatch.
# One-time setup: Settings > Pages > Build and deployment > Source must be "GitHub Actions".
name: pkgdown

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    name: pkgdown
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: seanthimons/baseline/.github/workflows/pkgdown.yaml@067b932909c9ca4cdce189717c99a62a812d3db9 # v2.2.1
    # with:
    #   quarto: true
    #   pre-build-script: dev/pre_build.R
