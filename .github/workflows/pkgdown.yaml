# Build documentation on pull requests; deploy main, releases, and manual builds.
# One-time setup: Settings > Pages > Build and deployment > Source must be "GitHub Actions".
name: pkgdown

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
  cancel-in-progress: true

jobs:
  pkgdown:
    name: pkgdown
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: seanthimons/baseline/.github/workflows/pkgdown.yaml@0a2a80a6d045ffbdacedd59e35dce1497e2acfc1 # v1.0.0
    # with:
    #   quarto: true
    #   pre-build-script: dev/pre_build.R
